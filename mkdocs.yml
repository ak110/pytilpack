site_name: pytilpack
site_description: Pythonのユーティリティ集
site_url: https://ak110.github.io/pytilpack/
repo_url: https://github.com/ak110/pytilpack
repo_name: ak110/pytilpack

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: ja
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Python 3.12以上が必要。導入・extras・モジュール一覧は利用者向けガイドを参照し、APIの詳細はソースコードを読む。
      sections:
        ドキュメント:
          - index.md: ドキュメント入口
          - guide/index.md: インストール・extras一覧・モジュール一覧
          - guide/cli.md: CLIコマンド

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - ホーム: index.md
  - 使い方:
      - 概要: guide/index.md
      - CLIコマンド: guide/cli.md
  - 開発:
      - 概要: development/index.md
      - 開発手順: development/development.md
      - アーキテクチャ: development/architecture.md

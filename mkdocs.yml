site_name: pytilpack
site_description: Pythonのユーティリティ集
site_url: https://ak110.github.io/pytilpack/
repo_url: https://github.com/ak110/pytilpack
repo_name: ak110/pytilpack

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: ja
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Python 3.12以上が必要。導入・extras・モジュール分類は利用者向けガイドを参照する。
      sections:
        ドキュメント:
          - index.md: ドキュメント入口
          - guide/index.md: インストール・extras一覧・モジュール一覧
          - guide/cli.md: CLIコマンド
        Webフレームワーク:
          - api/fastapi.md
          - api/flask.md
          - api/flask_login.md
          - api/quart.md
          - api/quart_auth.md
        データ処理・シリアライゼーション:
          - api/csv.md
          - api/dataclasses.md
          - api/json.md
          - api/jsonc.md
          - api/pydantic.md
          - api/sqlalchemy.md
          - api/yaml.md
        セキュリティ・暗号:
          - api/crypto.md
          - api/msal.md
          - api/pycrypto.md
          - api/secrets.md
        HTTP・Web:
          - api/data_url.md
          - api/healthcheck.md
          - api/htmlrag.md
          - api/http.md
          - api/httpx.md
          - api/sse.md
          - api/web.md
        国際化・テキスト処理:
          - api/babel.md
          - api/base64.md
          - api/i18n.md
          - api/markdown.md
          - api/tiktoken.md
        非同期・並行処理:
          - api/asyncio.md
          - api/ratelimit.md
          - api/threading.md
          - api/threadinga.md
        ファイルシステム・OS:
          - api/cache.md
          - api/fnctl.md
          - api/io.md
          - api/pathlib.md
          - api/zipfile.md
        開発・テスト支援:
          - api/datetime.md
          - api/environ.md
          - api/functools.md
          - api/importlib.md
          - api/logging.md
          - api/paginator.md
          - api/pytest.md
          - api/python.md
          - api/random.md
          - api/tqdm.md
          - api/typing.md
          - api/validator.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - ホーム: index.md
  - 使い方:
      - 概要: guide/index.md
      - CLIコマンド: guide/cli.md
  - APIリファレンス:
      - Webフレームワーク:
          - pytilpack.fastapi: api/fastapi.md
          - pytilpack.flask: api/flask.md
          - pytilpack.flask_login: api/flask_login.md
          - pytilpack.quart: api/quart.md
          - pytilpack.quart_auth: api/quart_auth.md
      - データ処理・シリアライゼーション:
          - pytilpack.csv: api/csv.md
          - pytilpack.dataclasses: api/dataclasses.md
          - pytilpack.json: api/json.md
          - pytilpack.jsonc: api/jsonc.md
          - pytilpack.pydantic: api/pydantic.md
          - pytilpack.sqlalchemy: api/sqlalchemy.md
          - pytilpack.yaml: api/yaml.md
      - セキュリティ・暗号:
          - pytilpack.crypto: api/crypto.md
          - pytilpack.msal: api/msal.md
          - pytilpack.pycrypto: api/pycrypto.md
          - pytilpack.secrets: api/secrets.md
      - HTTP・Web:
          - pytilpack.data_url: api/data_url.md
          - pytilpack.healthcheck: api/healthcheck.md
          - pytilpack.htmlrag: api/htmlrag.md
          - pytilpack.http: api/http.md
          - pytilpack.httpx: api/httpx.md
          - pytilpack.sse: api/sse.md
          - pytilpack.web: api/web.md
      - 国際化・テキスト処理:
          - pytilpack.babel: api/babel.md
          - pytilpack.base64: api/base64.md
          - pytilpack.i18n: api/i18n.md
          - pytilpack.markdown: api/markdown.md
          - pytilpack.tiktoken: api/tiktoken.md
      - 非同期・並行処理:
          - pytilpack.asyncio: api/asyncio.md
          - pytilpack.ratelimit: api/ratelimit.md
          - pytilpack.threading: api/threading.md
          - pytilpack.threadinga: api/threadinga.md
      - ファイルシステム・OS:
          - pytilpack.cache: api/cache.md
          - pytilpack.fnctl: api/fnctl.md
          - pytilpack.io: api/io.md
          - pytilpack.pathlib: api/pathlib.md
          - pytilpack.zipfile: api/zipfile.md
      - 開発・テスト支援:
          - pytilpack.datetime: api/datetime.md
          - pytilpack.environ: api/environ.md
          - pytilpack.functools: api/functools.md
          - pytilpack.importlib: api/importlib.md
          - pytilpack.logging: api/logging.md
          - pytilpack.paginator: api/paginator.md
          - pytilpack.pytest: api/pytest.md
          - pytilpack.python: api/python.md
          - pytilpack.random: api/random.md
          - pytilpack.tqdm: api/tqdm.md
          - pytilpack.typing: api/typing.md
          - pytilpack.validator: api/validator.md
  - 開発:
      - 概要: development/index.md
      - 開発手順: development/development.md
      - アーキテクチャ: development/architecture.md

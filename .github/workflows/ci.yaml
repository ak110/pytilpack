name: CI

on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "**"
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 開発モード: DeprecationWarningなどの隠れた問題を早期検出する
  PYTHONDEVMODE: "1"
  # サプライチェーン攻撃対策: uvがlockfileを常に尊重する
  UV_FROZEN: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: [ "3.12", "3.13", "3.14", "3.15" ]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # mise等がGitHub APIを呼び出す際のレート制限（403）回避。
      # container jobでは明示しないとsecrets.GITHUB_TOKENがコンテナへ渡らない
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 利用者設定に依存しないロック検証
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          set -euo pipefail
          config_dir="$(mktemp -d)"
          trap 'rmdir "$config_dir"' EXIT
          # UV_FROZENではlockfileの最新性を検査しないため、この検査だけ解除する。
          env --unset=UV_FROZEN XDG_CONFIG_HOME="$config_dir" uv lock --check

      # キャッシュのキーへ使う、イメージが同梱するpyfltrの版。イメージが同梱するツール群はこの版で決まる。
      - name: イメージ同梱のpyfltrの版
        if: ${{ matrix.python-version == '3.15' }}
        id: image
        run: |
          set -euo pipefail
          # 版の表示を標準エラーへ書く旧版のイメージでも取り出せるよう、両方を受け取る。
          version="$(pyfltr --version 2>&1 | sed -n 's/^pyfltr //p')"
          test -n "$version"
          echo "pyfltr-version=${version}" >> "$GITHUB_OUTPUT"

      # キャッシュなしの計測（2026年11月、pyfltr 3.27.0のイメージ）では、全検査のジョブが/cacheへ加えるのは
      # mise（pyfltr ciのツール導入、約82MB）、pnpm（約129MB）、uv（プロジェクトの依存、約388MB）で、
      # pytestのみのジョブはmiseを増やさなかった。pnpmとuvの増分はレジストリから短時間で取得でき、
      # 保存するとイメージ同梱分（数百MB）まで毎回アーカイブし直すため、全検査のジョブの/cache/miseだけを保存する。
      # キーは内容を決める入力（イメージのpyfltrの版と設定）のハッシュとし、restore-keysを置かない。
      # 入力が同じ実行は完全一致で復元して保存を省き、イメージの更新後は新しいキーで同梱ツールから作り直す。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.python-version == '3.15' }}
        with:
          path: /cache/mise
          key: pyfltr-mise-${{ runner.os }}-${{ steps.image.outputs.pyfltr-version }}-${{ hashFiles('pyproject.toml', 'mise.toml') }}

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      # 静的解析は基準とする1つの版だけで実行し、他の版はpytestで実行時互換性だけを検証する。
      - name: Test with pyfltr（全検査）
        if: ${{ matrix.python-version == '3.15' }}
        run: pyfltr ci --output-format=github-annotations

      - name: Test with pyfltr（pytestのみ）
        if: ${{ matrix.python-version != '3.15' }}
        run: pyfltr ci --commands=pytest --output-format=github-annotations

  cli-smoke:
    runs-on: ubuntu-latest
    needs: test
    container:
      image: ghcr.io/ak110/pyfltr:latest
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: "3.13"
      # mise等がGitHub APIを呼び出す際のレート制限（403）回避。
      # container jobでは明示しないとsecrets.GITHUB_TOKENがコンテナへ渡らない
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # このジョブはmiseのツールを使わず、/cacheへ加えるのはレジストリから短時間で取得できるuvの依存だけのため、
      # キャッシュを復元しない（testジョブのキャッシュ対象の選び方と同じ判断）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build wheel
        run: uv build --wheel

      - name: 各extra単独とallのimport・asserts・CLIを検証
        run: |
          set -euo pipefail
          wheel=$(ls dist/pytilpack-*.whl)
          uv run --no-project python scripts/check_extras_imports.py "$wheel"
